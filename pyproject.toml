[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concurrency-guard"
version = "2.1.0"
description = "Universal static concurrency analysis, semantic taint tracking, and runtime verification for Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "libcst>=1.4.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AyushkhatiDev/concurrency-guard"
Repository = "https://github.com/AyushkhatiDev/concurrency-guard"
Issues = "https://github.com/AyushkhatiDev/concurrency-guard/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
cguard = "concurrency_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/concurrency_guard"]

[tool.mypy]
# Mypy itself no longer supports a Python 3.9 target; runtime support remains >=3.9.
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep typing.Optional/Union so Typer's runtime get_type_hints works on Python 3.9.
ignore = ["B008", "UP006", "UP007", "UP045"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"


